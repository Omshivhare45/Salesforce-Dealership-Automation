<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Received | Take A Drive</title>
  <meta name="theme-color" content="#000000" />

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --gray-100: #d9d9d9;
      --gray-300: #a6a6a6;
      --gray-500: #6b6b6b;
      --gray-700: #2e2e2e;
      --gray-900: #0d0d0d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow: hidden;
    }

    /* Scene with perspective for the 3D effect */
    .scene {
      perspective: 900px;
      width: 180px;
      height: 180px;
      margin-bottom: 30px;
    }

    /* Card that flips into view */
    .badge {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: flipIn 1.1s cubic-bezier(.2,.8,.2,1) forwards;
      transform: rotateY(-180deg);
    }

    @keyframes flipIn {
      0%   { transform: rotateY(-180deg) scale(.8); opacity: 0; }
      60%  { opacity: 1; }
      100% { transform: rotateY(0deg) scale(1); opacity: 1; }
    }

    /* Circle */
    .disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #2a2a2a, var(--black) 70%);
      border: 1px solid var(--gray-700);
      box-shadow:
        0 25px 40px rgba(0,0,0,.8),
        inset 0 2px 6px rgba(255,255,255,.08),
        inset 0 -8px 16px rgba(0,0,0,.6);
    }

    /* Ring that draws itself */
    .ring {
      position: absolute;
      inset: 10px;
      width: calc(100% - 20px);
      height: calc(100% - 20px);
      transform: rotate(-90deg);
    }

    .ring circle {
      fill: none;
      stroke-linecap: round;
    }

    .ring .track { stroke: var(--gray-700); stroke-width: 3; }

    .ring .progress {
      stroke: var(--white);
      stroke-width: 3;
      stroke-dasharray: 339;
      stroke-dashoffset: 339;
      animation: drawRing 1s ease-out .6s forwards;
    }

    @keyframes drawRing {
      to { stroke-dashoffset: 0; }
    }

    /* Checkmark */
    .check {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check svg {
      width: 70px;
      height: 70px;
      fill: none;
      stroke: var(--white);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .check path {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawCheck .5s ease-out 1.3s forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* One soft ripple after success */
    .ripple {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--gray-500);
      opacity: 0;
      animation: ripple 1.4s ease-out 1.8s forwards;
    }

    @keyframes ripple {
      0%   { transform: scale(1); opacity: .7; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* Text */
    .text {
      text-align: center;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp .8s ease-out 1.5s forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      color: var(--gray-300);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 700;
      letter-spacing: -.5px;
      margin-bottom: 12px;
    }

    .text p {
      color: var(--gray-300);
      font-size: 15px;
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto;
    }

    /* Receipt card that slides up in 3D */
    .receipt {
      margin-top: 36px;
      width: 100%;
      max-width: 360px;
      background: var(--gray-900);
      border: 1px solid var(--gray-700);
      padding: 22px 24px;
      transform-origin: top center;
      transform: perspective(900px) rotateX(-18deg) translateY(30px);
      opacity: 0;
      animation: receiptIn .9s cubic-bezier(.2,.8,.2,1) 2s forwards;
    }

    @keyframes receiptIn {
      to { transform: perspective(900px) rotateX(0) translateY(0); opacity: 1; }
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--gray-700);
    }

    .row:last-child { border-bottom: none; }
    .row span:first-child { color: var(--gray-500); }
    .row span:last-child { color: var(--white); }

    .status {
      color: var(--white);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Button */
    .home-btn {
      margin-top: 30px;
      display: inline-block;
      border: 1px solid var(--white);
      padding: 14px 28px;
      color: var(--white);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      opacity: 0;
      animation: fadeUp .6s ease-out 2.4s forwards;
    }

    .home-btn:hover {
      background: var(--white);
      color: var(--black);
    }

    /* Respect users who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        animation-fill-mode: forwards !important;
      }
    }
  </style>
</head>

<body>
  <div class="scene">
    <div class="badge">
      <div class="disc"></div>

      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="progress" cx="60" cy="60" r="54"></circle>
      </svg>

      <div class="check">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <path d="M22 42 L35 55 L58 28"></path>
        </svg>
      </div>

      <div class="ripple"></div>
    </div>
  </div>

  <div class="text">
    <div class="eyebrow">Request confirmed</div>
    <h1>Thank you for booking</h1>
    <p>Your test drive request has been received. Our team will contact you shortly to confirm your drive.</p>
  </div>

  <div class="receipt">
    <div class="row"><span>Status</span><span class="status">RECEIVED</span></div>
    <div class="row"><span>Service</span><span>Test Drive</span></div>
    <div class="row"><span>Next step</span><span>Team call-back</span></div>
  </div>

  <a class="home-btn" href="index.html">Back to Home</a>
</body>
</html>
